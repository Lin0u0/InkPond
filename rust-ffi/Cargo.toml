[package]
name = "typst-ios"
version = "0.15.0"
edition = "2021"

[lib]
name = "typst_ios"
crate-type = ["staticlib"]

[dependencies]
typst         = "0.15.0"
typst-pdf     = "0.15.0"
typst-svg     = "0.15.0"
typst-assets  = { version = "0.15.0", features = ["fonts"] }
typst-library = "0.15.0"
typst-layout  = "0.15.0"
hayagriva     = "0.10.1"
syntect       = { version = "5.3", default-features = false, features = ["parsing"] }
stacker       = "0.1.23"
# Package download
ureq          = "2"
tar           = "0.4"
flate2        = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
